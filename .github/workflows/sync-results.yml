name: Sync match results

# Auto-applies finished World Cup results + scores predictions by calling the
# app's /api/cron/sync-results route. Runs on a schedule and on manual dispatch.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://world-cup-predection.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value set in the app's environment

on:
  schedule:
    # Every 15 min, offset from :00/:30 — GitHub heavily delays runs scheduled
    # at popular minutes (we saw 2–4h gaps on */30). This is only the backstop:
    # the app also kicks its own sync whenever a match is in play (src/lib/autosync.ts).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger results sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured — skipping (set repo secrets to enable)."
            exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync-results")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
